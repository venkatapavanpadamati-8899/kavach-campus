<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trusted Contacts — Kavach Campus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    body { background: var(--bg-body); }
    .dashboard { display: flex; min-height: 100vh; }
    
    /* ── Sidebar (Reused) ── */
    .sidebar { width: 260px; background: var(--bg-surface); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: var(--z-fixed); transition: transform var(--transition-base); }
    .sidebar-header { padding: var(--space-6); display: flex; align-items: center; gap: var(--space-3); border-bottom: 1px solid var(--gray-200); }
    .sidebar-header svg { width: 32px; height: 32px; }
    .sidebar-header-text { font-family: var(--font-display); font-weight: var(--font-bold); font-size: var(--text-lg); }
    .sidebar-nav { flex: 1; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); color: var(--text-secondary); border-radius: var(--radius-lg); font-weight: var(--font-medium); transition: all var(--transition-fast); text-decoration: none; }
    .nav-item:hover { background: var(--gray-100); color: var(--text-primary); }
    .nav-item.active { background: var(--primary-alpha); color: var(--secondary); font-weight: var(--font-semibold); }
    
    /* ── Main Content ── */
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 70px; background: var(--bg-surface); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); position: sticky; top: 0; z-index: var(--z-sticky); }
    .content-area { padding: var(--space-6) var(--space-8); flex: 1; overflow-y: auto; max-width: 1000px; margin: 0 auto; width: 100%; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4); }
    .page-title { font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .page-subtitle { color: var(--text-secondary); }

    /* ── Contacts List ── */
    .contacts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-4); }
    
    .contact-card { background: var(--bg-surface); border-radius: var(--radius-xl); border: 1px solid var(--gray-200); padding: var(--space-5); display: flex; align-items: flex-start; gap: var(--space-4); position: relative; transition: all var(--transition-fast); }
    .contact-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--secondary); }
    
    .contact-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-alpha); color: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: var(--text-xl); font-weight: var(--font-bold); flex-shrink: 0; }
    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: var(--text-lg); font-weight: var(--font-bold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .contact-relation { font-size: var(--text-xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: var(--font-bold); margin-bottom: var(--space-2); }
    .contact-detail { font-size: var(--text-sm); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .contact-detail svg { color: var(--gray-400); }

    .delete-btn { position: absolute; top: var(--space-4); right: var(--space-4); color: var(--gray-400); background: none; border: none; cursor: pointer; padding: 4px; border-radius: var(--radius-sm); transition: all var(--transition-fast); }
    .delete-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .add-contact-card { background: var(--gray-50); border-radius: var(--radius-xl); border: 2px dashed var(--gray-300); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-8); cursor: pointer; transition: all var(--transition-fast); min-height: 160px; color: var(--text-secondary); }
    .add-contact-card:hover { border-color: var(--secondary); color: var(--secondary); background: var(--primary-alpha); }
    .add-contact-card svg { width: 32px; height: 32px; margin-bottom: var(--space-2); }

    /* ── Modal ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: var(--z-modal); display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); padding: var(--space-4); }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--bg-surface); border-radius: var(--radius-2xl); width: 100%; max-width: 440px; overflow: hidden; animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .modal-header { padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: var(--text-lg); font-weight: var(--font-bold); }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 4px; border-radius: 4px; }
    .modal-close:hover { background: var(--gray-100); color: var(--text-primary); }
    .modal-body { padding: var(--space-6); }
    
    @media (max-width: 768px) {
      .sidebar { position: fixed; transform: translateX(-100%); }
      .content-area { padding: var(--space-4); }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 40 40" fill="none"><path d="M20 2L4 10V20C4 30 12 38 20 40C28 38 36 30 36 20V10L20 2Z" fill="url(#sg)"/><path d="M15 20L18 23L25 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="sg" x1="4" y1="2" x2="36" y2="40"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs></svg>
        <span class="sidebar-header-text">Kavach</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/pages/student-dashboard.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
        </a>
        <a href="/pages/safe-walk.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
          Safe Walk
        </a>
        <a href="/pages/contacts.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Trusted Contacts
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">Trusted Contacts</h1>
            <p class="page-subtitle">These contacts will be notified during emergencies or when Safe Walk is active.</p>
          </div>
        </div>

        <div class="contacts-grid" id="contacts-list">
          <!-- Dynamic Contacts Loaded Here -->

          <!-- Add Button -->
          <div class="add-contact-card animate-fade-in-up" style="animation-delay:0.2s" onclick="openModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <div style="font-weight:600">Add New Contact</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add Contact Modal -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Add Trusted Contact</div>
        <button class="modal-close" onclick="closeModal()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="contact-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="c-name" required placeholder="e.g. John Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Relationship</label>
            <input type="text" class="form-input" id="c-relation" required placeholder="e.g. Parent, Friend">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-input" id="c-phone" required placeholder="+91 xxxxx xxxxx">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:var(--space-2)">Save Contact</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!App.requireAuth()) throw new Error("Auth");

    function openModal() {
      document.getElementById('add-modal').classList.add('active');
    }
    
    function closeModal() {
      document.getElementById('add-modal').classList.remove('active');
      document.getElementById('contact-form').reset();
    }

    async function loadContacts() {
      try {
        const res = await API.contacts.getAll();
        const contacts = res.contacts || [];
        
        const grid = document.getElementById('contacts-list');
        const addBtn = document.querySelector('.add-contact-card');
        
        // Remove existing contacts
        document.querySelectorAll('.contact-card').forEach(el => el.remove());
        
        contacts.forEach(c => {
          const newCard = createContactElement(c.id, c.name, c.relationship, c.phone);
          grid.insertBefore(newCard, addBtn);
        });
      } catch (err) {
        console.error(err);
        App.toast('Failed to load contacts', 'error');
      }
    }

    function createContactElement(id, name, rel, phone) {
      const newCard = document.createElement('div');
      newCard.className = 'contact-card animate-fade-in-up';
      newCard.dataset.id = id;
      newCard.innerHTML = `
        <div class="contact-avatar">${name.charAt(0).toUpperCase()}</div>
        <div class="contact-info">
          <div class="contact-name">${App.escapeHtml(name)}</div>
          <div class="contact-relation">${App.escapeHtml(rel)}</div>
          <div class="contact-detail">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            ${App.escapeHtml(phone)}
          </div>
        </div>
        <button class="delete-btn" onclick="deleteContact(this, '${id}')" aria-label="Delete">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      `;
      return newCard;
    }

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Saving...';
      submitBtn.disabled = true;

      const name = document.getElementById('c-name').value.trim();
      const relationship = document.getElementById('c-relation').value.trim();
      const phone = document.getElementById('c-phone').value.trim();

      try {
        const res = await API.contacts.add({ name, relationship, phone });
        
        const newCard = createContactElement(res.id, name, relationship, phone);
        const grid = document.getElementById('contacts-list');
        const addBtn = document.querySelector('.add-contact-card');
        grid.insertBefore(newCard, addBtn);
        
        closeModal();
        App.toast('Contact added successfully', 'success');
      } catch (err) {
        console.error(err);
        App.toast(err.error || 'Failed to add contact', 'error');
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });

    async function deleteContact(btn, id) {
      if(confirm('Are you sure you want to remove this contact?')) {
        try {
          await API.contacts.remove(id);
          btn.closest('.contact-card').remove();
          App.toast('Contact removed', 'info');
        } catch (err) {
          console.error(err);
          App.toast(err.error || 'Failed to remove contact', 'error');
        }
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadContacts);
  </script>
</body>
</html>
