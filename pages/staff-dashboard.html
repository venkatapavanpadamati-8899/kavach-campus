<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — Kavach Campus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    body { background: var(--bg-body); }
    .dashboard { display: flex; min-height: 100vh; }
    
    /* ── Sidebar (Reused) ── */
    .sidebar { width: 260px; background: var(--bg-surface); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: var(--z-fixed); transition: transform var(--transition-base); }
    .sidebar-header { padding: var(--space-6); display: flex; align-items: center; gap: var(--space-3); border-bottom: 1px solid var(--gray-200); }
    .sidebar-header svg { width: 32px; height: 32px; }
    .sidebar-header-text { font-family: var(--font-display); font-weight: var(--font-bold); font-size: var(--text-lg); }
    .sidebar-nav { flex: 1; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); color: var(--text-secondary); border-radius: var(--radius-lg); font-weight: var(--font-medium); transition: all var(--transition-fast); text-decoration: none; }
    .nav-item:hover { background: var(--gray-100); color: var(--text-primary); }
    .nav-item.active { background: var(--primary-alpha); color: var(--secondary); font-weight: var(--font-semibold); }
    .sidebar-footer { padding: var(--space-4); border-top: 1px solid var(--gray-200); }
    .user-profile { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2); margin-bottom: var(--space-4); }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--secondary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: var(--font-bold); }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-weight: var(--font-semibold); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: var(--text-xs); color: var(--text-tertiary); background: var(--gray-100); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
    
    /* ── Main Content ── */
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 70px; background: var(--bg-surface); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); position: sticky; top: 0; z-index: var(--z-sticky); }
    .content-area { padding: var(--space-6) var(--space-8); flex: 1; overflow-y: auto; }
    .page-title { font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .page-subtitle { color: var(--text-secondary); margin-bottom: var(--space-6); }

    /* ── Metrics ── */
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-8); }
    .metric-card { background: var(--bg-surface); border: 1px solid var(--gray-200); border-radius: var(--radius-xl); padding: var(--space-5); display: flex; align-items: center; gap: var(--space-4); }
    .metric-icon { width: 48px; height: 48px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; }
    .metric-info { flex: 1; }
    .metric-label { font-size: var(--text-xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: var(--font-bold); margin-bottom: 4px; }
    .metric-value { font-size: var(--text-3xl); font-weight: var(--font-bold); font-family: var(--font-display); line-height: 1; }

    /* ── Data Table ── */
    .data-card { background: var(--bg-surface); border: 1px solid var(--gray-200); border-radius: var(--radius-xl); overflow: hidden; }
    .data-header { padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-4); }
    .data-title { font-size: var(--text-lg); font-weight: var(--font-semibold); }
    
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: var(--gray-50); padding: var(--space-3) var(--space-6); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); font-weight: var(--font-semibold); border-bottom: 1px solid var(--gray-200); }
    td { padding: var(--space-4) var(--space-6); border-bottom: 1px solid var(--gray-100); font-size: var(--text-sm); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--gray-50); }
    
    .td-case { font-family: monospace; font-weight: var(--font-bold); color: var(--text-secondary); }
    .td-subject { font-weight: var(--font-medium); color: var(--text-primary); max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .action-btn { background: var(--primary-alpha); color: var(--secondary); border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
    .action-btn:hover { background: var(--secondary); color: white; }
    
    @media (max-width: 768px) {
      .sidebar { position: fixed; transform: translateX(-100%); }
      .content-area { padding: var(--space-4); }
    }

    /* ── Notifications ── */
    .notification-bell { position: relative; cursor: pointer; padding: 8px; border-radius: 50%; transition: background 0.2s; }
    .notification-bell:hover { background: var(--gray-100); }
    .notification-badge { position: absolute; top: 4px; right: 4px; background: var(--danger); color: white; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg-surface); display: none; }
    .notification-dropdown { position: absolute; top: 100%; right: 0; width: 320px; background: var(--bg-surface); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: none; flex-direction: column; z-index: 100; max-height: 400px; overflow-y: auto; }
    .notification-dropdown.open { display: flex; }
    .notification-item { padding: var(--space-3); border-bottom: 1px solid var(--gray-100); font-size: var(--text-sm); }
    .notification-item:hover { background: var(--gray-50); }
    .notification-item.unread { font-weight: bold; background: #eff6ff; }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 40 40" fill="none"><path d="M20 2L4 10V20C4 30 12 38 20 40C28 38 36 30 36 20V10L20 2Z" fill="url(#sg)"/><path d="M15 20L18 23L25 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="sg" x1="4" y1="2" x2="36" y2="40"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs></svg>
        <span class="sidebar-header-text">Kavach</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/pages/staff-dashboard.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Active Cases
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="nav-avatar">S</div>
          <div class="user-info">
            <div class="user-name" id="nav-name">Staff Name</div>
            <div class="user-role" id="nav-role">STAFF</div>
          </div>
        </div>
        <button class="btn btn-outline" style="width:100%" onclick="window.location.href='/pages/login.html'">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div style="font-weight:600;color:var(--text-secondary)">Staff Portal</div>
        </div>
        <div style="position: relative;">
          <div class="notification-bell" onclick="document.getElementById('notif-dropdown').classList.toggle('open')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notification-badge" id="notif-badge">0</span>
          </div>
          <div class="notification-dropdown" id="notif-dropdown">
            <div style="padding: 12px; font-weight: bold; border-bottom: 1px solid var(--gray-200);">Notifications</div>
            <div id="notif-list">
              <div class="notification-item" style="color: var(--text-secondary); text-align: center;">No new notifications</div>
            </div>
          </div>
        </div>
      </header>

      <div class="content-area">
        <h1 class="page-title">Assigned Cases</h1>
        <p class="page-subtitle">Manage and resolve cases routed to your department.</p>

        <div class="metrics-grid">
          <div class="metric-card animate-fade-in-up">
            <div class="metric-icon" style="background:var(--danger-bg);color:var(--danger)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="metric-info">
              <div class="metric-label">High Severity (L3/L4)</div>
              <div class="metric-value" id="count-high">0</div>
            </div>
          </div>
          <div class="metric-card animate-fade-in-up" style="animation-delay:0.1s">
            <div class="metric-icon" style="background:var(--primary-alpha);color:var(--secondary)">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="metric-info">
              <div class="metric-label">Active Cases</div>
              <div class="metric-value" id="count-active">0</div>
            </div>
          </div>
        </div>

        <div class="data-card animate-fade-in-up" style="animation-delay:0.2s">
          <div class="data-header">
            <h2 class="data-title">Case Queue</h2>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Case ID</th>
                  <th>Severity</th>
                  <th>Status</th>
                  <th>Subject</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="queue-body">
                <tr><td colspan="6" style="text-align:center;color:var(--text-secondary)">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!App.requireAuth()) throw new Error("Auth");

    const user = API.getUser();
    if (user.role === 'STUDENT') {
      window.location.href = '/pages/student-dashboard.html';
    }

    document.getElementById('nav-name').textContent = user.full_name;
    document.getElementById('nav-avatar').textContent = user.full_name.charAt(0).toUpperCase();
    document.getElementById('nav-role').textContent = user.role;

    async function loadStaffQueue() {
      try {
        const res = await API.cases.getAll(); // for staff, backend filters by their role
        const cases = res.cases || [];
        
        let highCount = 0;
        let activeCount = 0;
        
        const tbody = document.getElementById('queue-body');
        if (cases.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:32px;">No cases assigned to your department.</td></tr>`;
          return;
        }

        tbody.innerHTML = cases.map(c => {
          if (c.severity === 'L3' || c.severity === 'L4') highCount++;
          if (c.status !== 'RESOLVED' && c.status !== 'CLOSED' && c.status !== 'REJECTED') activeCount++;

          return `
            <tr>
              <td class="td-case">${c.case_number}</td>
              <td>${App.severityBadge(c.severity)}</td>
              <td>${App.statusBadge(c.status)}</td>
              <td class="td-subject" title="${c.subject}">${App.escapeHtml(c.subject)}</td>
              <td>${new Date(c.created_at).toLocaleDateString()}</td>
              <td><a href="/pages/staff-case-details.html?id=${c.id}" class="action-btn">Manage</a></td>
            </tr>
          `;
        }).join('');

        document.getElementById('count-high').textContent = highCount;
        document.getElementById('count-active').textContent = activeCount;

      } catch (err) {
        console.error(err);
        App.toast('Failed to load queue', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadStaffQueue);

    // Setup WebSocket
    const socket = io({
      auth: { token: API.token }
    });

    socket.on('connect', () => {
      console.log('WebSocket connected');
    });

    let notifCount = 0;
    
    function addNotification(message, caseId) {
      notifCount++;
      const badge = document.getElementById('notif-badge');
      badge.textContent = notifCount;
      badge.style.display = 'inline-block';
      
      const list = document.getElementById('notif-list');
      if (notifCount === 1) list.innerHTML = ''; // Clear empty message
      
      const item = document.createElement('div');
      item.className = 'notification-item unread';
      item.innerHTML = `<strong>New Update:</strong> ${message} <br> <a href="/pages/staff-case-details.html?id=${caseId}" style="color: var(--secondary); font-size: 12px; display: inline-block; margin-top: 4px;">View Case</a>`;
      list.prepend(item);
    }

    socket.on('CASE_CREATED', (data) => {
      App.toast(`New case reported: ${data.caseNumber}`, data.severity === 'L4' ? 'error' : 'success');
      addNotification(`New case reported: ${data.caseNumber}`, data.id);
      loadStaffQueue(); // Reload table
    });

    socket.on('CASE_ESCALATED', (data) => {
      App.toast(`Case ${data.caseNumber} was escalated to level ${data.escalation_level}`, 'error');
      addNotification(`Case ${data.caseNumber} escalated. Reason: ${data.reason}`, data.id);
      loadStaffQueue(); // Reload table
    });
  </script>
</body>
</html>
