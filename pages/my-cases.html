<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cases — Kavach Campus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    body { background: var(--bg-body); }
    .dashboard { display: flex; min-height: 100vh; }
    
    /* ── Sidebar (Reused) ── */
    .sidebar { width: 260px; background: var(--bg-surface); border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: var(--z-fixed); transition: transform var(--transition-base); }
    .sidebar-header { padding: var(--space-6); display: flex; align-items: center; gap: var(--space-3); border-bottom: 1px solid var(--gray-200); }
    .sidebar-header svg { width: 32px; height: 32px; }
    .sidebar-header-text { font-family: var(--font-display); font-weight: var(--font-bold); font-size: var(--text-lg); }
    .sidebar-nav { flex: 1; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); color: var(--text-secondary); border-radius: var(--radius-lg); font-weight: var(--font-medium); transition: all var(--transition-fast); text-decoration: none; }
    .nav-item:hover { background: var(--gray-100); color: var(--text-primary); }
    .nav-item.active { background: var(--primary-alpha); color: var(--secondary); font-weight: var(--font-semibold); }
    
    /* ── Main Content ── */
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 70px; background: var(--bg-surface); border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); position: sticky; top: 0; z-index: var(--z-sticky); }
    .content-area { padding: var(--space-6) var(--space-8); flex: 1; overflow-y: auto; }
    .page-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-6); }
    .page-title { font-size: var(--text-2xl); font-weight: var(--font-bold); margin-bottom: var(--space-1); }
    .page-subtitle { color: var(--text-secondary); }

    /* ── Filters ── */
    .filters-bar { display: flex; gap: var(--space-4); margin-bottom: var(--space-6); background: var(--bg-surface); padding: var(--space-4); border-radius: var(--radius-xl); border: 1px solid var(--gray-200); flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: var(--space-2); }
    .filter-label { font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--text-secondary); }
    .filter-select { padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--gray-300); font-size: var(--text-sm); outline: none; }

    /* ── Case List ── */
    .cases-list { display: flex; flex-direction: column; gap: var(--space-4); }
    .case-card { background: var(--bg-surface); border-radius: var(--radius-xl); border: 1px solid var(--gray-200); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); transition: all var(--transition-fast); text-decoration: none; color: inherit; }
    .case-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--secondary); }
    .case-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .case-id-badge { background: var(--gray-100); padding: 4px 8px; border-radius: var(--radius-md); font-family: monospace; font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--text-secondary); }
    .case-subject { font-size: var(--text-lg); font-weight: var(--font-bold); margin-top: var(--space-2); }
    .case-meta { display: flex; gap: var(--space-4); font-size: var(--text-sm); color: var(--text-secondary); flex-wrap: wrap; }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .meta-item svg { color: var(--gray-400); }
    .case-footer { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-4); border-top: 1px solid var(--gray-100); }
    .badges { display: flex; gap: var(--space-2); }

    .empty-state { padding: var(--space-12); text-align: center; color: var(--text-secondary); background: var(--bg-surface); border-radius: var(--radius-xl); border: 1px dashed var(--gray-300); }
    
    @media (max-width: 768px) {
      .sidebar { position: fixed; transform: translateX(-100%); }
      .content-area { padding: var(--space-4); }
      .case-header { flex-direction: column; gap: var(--space-2); }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg viewBox="0 0 40 40" fill="none"><path d="M20 2L4 10V20C4 30 12 38 20 40C28 38 36 30 36 20V10L20 2Z" fill="url(#sg)"/><path d="M15 20L18 23L25 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="sg" x1="4" y1="2" x2="36" y2="40"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs></svg>
        <span class="sidebar-header-text">Kavach</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/pages/student-dashboard.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
        </a>
        <a href="/pages/report.html" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Report Incident
        </a>
        <a href="/pages/my-cases.html" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          My Cases
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline" style="width:100%" onclick="window.location.href='/pages/login.html'">Sign Out</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </header>

      <div class="content-area">
        <div class="page-header">
          <div>
            <h1 class="page-title">My Cases</h1>
            <p class="page-subtitle">Track the status of your reported incidents and SOS alerts.</p>
          </div>
          <a href="/pages/report.html" class="btn btn-primary">New Report</a>
        </div>

        <div class="filters-bar">
          <div class="filter-group">
            <span class="filter-label">Status:</span>
            <select class="filter-select" id="filter-status" onchange="renderCases()">
              <option value="ALL">All Statuses</option>
              <option value="ACTIVE">Active (Open/Assigned/InProgress)</option>
              <option value="RESOLVED">Resolved / Closed</option>
            </select>
          </div>
        </div>

        <div class="cases-list" id="cases-list">
          <div class="empty-state">
            <div class="spinner" style="margin:0 auto"></div>
            <p style="margin-top:var(--space-4)">Loading your cases...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!App.requireAuth()) throw new Error("Auth");

    let allCases = [];

    async function loadCases() {
      try {
        const res = await API.cases.getMy();
        allCases = res.cases || [];
        renderCases();
      } catch (err) {
        console.error(err);
        document.getElementById('cases-list').innerHTML = `
          <div class="empty-state" style="color:var(--danger)">Failed to load cases.</div>
        `;
      }
    }

    function renderCases() {
      const filter = document.getElementById('filter-status').value;
      const listEl = document.getElementById('cases-list');
      
      let filtered = allCases;
      if (filter === 'ACTIVE') {
        filtered = allCases.filter(c => !['RESOLVED', 'CLOSED', 'REJECTED'].includes(c.status));
      } else if (filter === 'RESOLVED') {
        filtered = allCases.filter(c => ['RESOLVED', 'CLOSED', 'REJECTED'].includes(c.status));
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="color:var(--gray-400);margin:0 auto 16px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <p>No cases found matching the criteria.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(c => {
        const isAnon = c.is_anonymous === 1;
        const icon = c.source === 'SOS' 
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>`;

        return `
          <a href="/pages/case-details.html?id=${c.id}" class="case-card animate-fade-in-up">
            <div class="case-header">
              <div>
                <div style="display:flex;align-items:center;gap:8px">
                  ${icon}
                  <span class="case-id-badge">${c.case_number}</span>
                  ${isAnon ? '<span class="badge badge-info" style="font-size:10px">Anonymous</span>' : ''}
                </div>
                <h3 class="case-subject">${App.escapeHtml(c.subject)}</h3>
              </div>
              <div class="badges">
                ${App.severityBadge(c.severity || 'L1')}
                ${App.statusBadge(c.status)}
              </div>
            </div>
            
            <div class="case-meta">
              <div class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                ${App.formatDateTime(c.created_at)}
              </div>
              ${c.category ? `
              <div class="meta-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                ${c.category.replace('_', ' ')}
              </div>` : ''}
            </div>
            
            <div class="case-footer">
              <span style="font-size:var(--text-sm);color:var(--text-secondary)">
                ${c.is_escalated ? '<span style="color:var(--danger)">⚠️ Escalated</span> • ' : ''}
                Click to view details and timeline
              </span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
          </a>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', loadCases);
  </script>
</body>
</html>
