<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP — Kavach Campus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .otp-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-body); padding:var(--space-6); }
    .otp-card { background:var(--bg-surface); border-radius:var(--radius-2xl); padding:var(--space-10); max-width:440px; width:100%; box-shadow:var(--shadow-xl); text-align:center; animation:scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .otp-icon { width:72px; height:72px; border-radius:var(--radius-full); background:linear-gradient(135deg,var(--primary-alpha),rgba(79,70,229,0.15)); display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-6); color:var(--secondary); }
    .otp-title { font-size:var(--text-2xl); font-weight:var(--font-bold); margin-bottom:var(--space-2); }
    .otp-subtitle { color:var(--text-secondary); font-size:var(--text-sm); margin-bottom:var(--space-8); }
    .otp-email { color:var(--secondary); font-weight:var(--font-semibold); }
    .otp-inputs { display:flex; gap:var(--space-3); justify-content:center; margin-bottom:var(--space-6); }
    .otp-input { width:52px; height:60px; text-align:center; font-size:var(--text-2xl); font-weight:var(--font-bold); border:2px solid var(--gray-200); border-radius:var(--radius-lg); background:var(--bg-surface-alt); transition:all var(--transition-base); }
    .otp-input:focus { border-color:var(--secondary); box-shadow:0 0 0 3px var(--primary-alpha); outline:none; }
    .otp-input.filled { border-color:var(--secondary); background:rgba(79,70,229,0.04); }
    .otp-input.error { border-color:var(--danger); animation:shake 0.4s; }
    .otp-input.success { border-color:var(--success); background:var(--success-bg); }
    .otp-timer { font-size:var(--text-sm); color:var(--text-secondary); margin-bottom:var(--space-6); }
    .otp-timer strong { color:var(--secondary); }
    .resend-btn { background:none; border:none; color:var(--secondary); font-weight:var(--font-semibold); cursor:pointer; font-size:var(--text-sm); }
    .resend-btn:disabled { color:var(--text-tertiary); cursor:not-allowed; }
    .otp-error { background:var(--danger-bg); color:var(--danger); padding:var(--space-3); border-radius:var(--radius-md); font-size:var(--text-sm); margin-bottom:var(--space-4); display:none; }
    .otp-error.visible { display:block; }
    .otp-success-overlay { position:fixed; inset:0; background:var(--bg-overlay); display:none; align-items:center; justify-content:center; z-index:var(--z-modal); }
    .otp-success-overlay.visible { display:flex; }
    .otp-success-card { background:#fff; border-radius:var(--radius-2xl); padding:var(--space-10); text-align:center; max-width:360px; animation:scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
    .success-check { width:80px; height:80px; border-radius:50%; background:var(--success-bg); display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-4); }
    .success-check svg { color:var(--success); }
    .dev-notice { background:var(--warning-bg); color:var(--warning); padding:var(--space-3); border-radius:var(--radius-md); font-size:var(--text-xs); margin-bottom:var(--space-4); text-align:left; }
  </style>
</head>
<body>
  <div class="otp-page">
    <div class="otp-card">
      <div class="otp-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 class="otp-title">Verify Your Account</h1>
      <p class="otp-subtitle">Enter the 6-digit code sent to<br><span class="otp-email" id="otp-email"></span></p>

      <div class="dev-notice" id="dev-notice" style="display:none">
        <strong>⚠ Development Mode:</strong> OTP is <code id="dev-otp-display" style="font-size:var(--text-lg);font-weight:bold"></code>
      </div>

      <div class="otp-error" id="otp-error"><span id="otp-error-text"></span></div>

      <div class="otp-inputs" id="otp-inputs">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 1" autofocus>
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 2">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 3">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 4">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 5">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Digit 6">
      </div>

      <div class="otp-timer" id="otp-timer">
        Resend code in <strong id="countdown">60</strong>s
      </div>

      <button class="resend-btn" id="resend-btn" disabled onclick="resendOtp()">Resend Code</button>

      <div style="margin-top:var(--space-6)">
        <button class="btn btn-primary btn-lg" id="verify-btn" style="width:100%" onclick="verifyOtp()">
          <span class="btn-text">Verify</span>
        </button>
      </div>

      <div style="margin-top:var(--space-6)">
        <a href="/pages/login.html" style="color:var(--text-secondary);font-size:var(--text-sm)">← Back to Login</a>
      </div>
    </div>
  </div>

  <!-- Success Overlay -->
  <div class="otp-success-overlay" id="success-overlay">
    <div class="otp-success-card">
      <div class="success-check">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h2 style="font-size:var(--text-xl);margin-bottom:var(--space-2)">Account Verified!</h2>
      <p style="color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--space-6)">Your account is now active. Redirecting to your dashboard...</p>
      <div class="spinner" style="margin:0 auto"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email') || '';
    const purpose = params.get('purpose') || 'REGISTRATION';
    const devOtp = params.get('dev_otp');

    document.getElementById('otp-email').textContent = email;
    if (devOtp) {
      document.getElementById('dev-notice').style.display = 'block';
      document.getElementById('dev-otp-display').textContent = devOtp;
    }

    // OTP input handling
    const inputs = document.querySelectorAll('.otp-input');
    inputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && i < inputs.length - 1) {
          inputs[i + 1].focus();
        }
        e.target.classList.toggle('filled', !!val);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          inputs[i - 1].focus();
        }
        if (e.key === 'Enter') verifyOtp();
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
        text.split('').forEach((char, j) => {
          if (inputs[j]) { inputs[j].value = char; inputs[j].classList.add('filled'); }
        });
        if (text.length === 6) verifyOtp();
      });
    });

    // Countdown timer
    let timeLeft = 60;
    const timer = setInterval(() => {
      timeLeft--;
      document.getElementById('countdown').textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        document.getElementById('otp-timer').style.display = 'none';
        document.getElementById('resend-btn').disabled = false;
      }
    }, 1000);

    async function resendOtp() {
      try {
        const result = await API.auth.resendOtp(email, purpose);
        if (result._dev_otp) {
          document.getElementById('dev-notice').style.display = 'block';
          document.getElementById('dev-otp-display').textContent = result._dev_otp;
        }
        App.toast('New OTP sent!', 'success');
        document.getElementById('resend-btn').disabled = true;
        timeLeft = 60;
        document.getElementById('otp-timer').style.display = 'block';
        const t = setInterval(() => {
          timeLeft--;
          document.getElementById('countdown').textContent = timeLeft;
          if (timeLeft <= 0) { clearInterval(t); document.getElementById('otp-timer').style.display='none'; document.getElementById('resend-btn').disabled=false; }
        }, 1000);
      } catch (err) {
        App.toast(err.error || 'Failed to resend OTP', 'error');
      }
    }

    async function verifyOtp() {
      const code = Array.from(inputs).map(i => i.value).join('');
      const errorEl = document.getElementById('otp-error');
      errorEl.classList.remove('visible');

      if (code.length !== 6) {
        errorEl.classList.add('visible');
        document.getElementById('otp-error-text').textContent = 'Please enter the complete 6-digit code.';
        inputs.forEach(i => i.classList.add('error'));
        setTimeout(() => inputs.forEach(i => i.classList.remove('error')), 500);
        return;
      }

      const btn = document.getElementById('verify-btn');
      App.showLoading(btn, 'Verifying...');

      try {
        const result = await API.auth.verifyOtp(email, code, purpose);

        inputs.forEach(i => i.classList.add('success'));

        if (purpose === 'PASSWORD_RESET') {
          // Redirect to reset password page
          window.location.href = `/pages/forgot-password.html?step=reset&token=${encodeURIComponent(result.resetToken)}`;
          return;
        }

        // Login successful
        if (result.token) {
          API.setToken(result.token);
          API.setUser(result.user);
        }

        document.getElementById('success-overlay').classList.add('visible');
        setTimeout(() => {
          window.location.href = '/pages/student-dashboard.html';
        }, 2000);
      } catch (err) {
        App.hideLoading(btn);
        errorEl.classList.add('visible');
        document.getElementById('otp-error-text').textContent = err.error || 'Invalid OTP. Please try again.';
        inputs.forEach(i => { i.classList.add('error'); i.value = ''; i.classList.remove('filled'); });
        setTimeout(() => inputs.forEach(i => i.classList.remove('error')), 500);
        inputs[0].focus();
      }
    }
  </script>
</body>
</html>
