<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Kavach Campus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .fp-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-body); padding:var(--space-6); }
    .fp-card { background:var(--bg-surface); border-radius:var(--radius-2xl); padding:var(--space-10); max-width:440px; width:100%; box-shadow:var(--shadow-xl); animation:fadeInUp 0.5s ease-out; }
    .fp-icon { width:64px; height:64px; border-radius:var(--radius-full); background:var(--primary-alpha); display:flex; align-items:center; justify-content:center; margin:0 auto var(--space-6); color:var(--secondary); }
    .fp-title { font-size:var(--text-2xl); font-weight:var(--font-bold); text-align:center; margin-bottom:var(--space-2); }
    .fp-subtitle { text-align:center; color:var(--text-secondary); font-size:var(--text-sm); margin-bottom:var(--space-6); }
    .fp-form { display:flex; flex-direction:column; gap:var(--space-4); }
    .fp-step { display:none; } .fp-step.active { display:block; }
    .fp-error { background:var(--danger-bg); color:var(--danger); padding:var(--space-3); border-radius:var(--radius-md); font-size:var(--text-sm); display:none; margin-bottom:var(--space-4); }
    .fp-error.visible { display:block; }
    .fp-success { background:var(--success-bg); color:var(--success); padding:var(--space-3); border-radius:var(--radius-md); font-size:var(--text-sm); display:none; margin-bottom:var(--space-4); }
    .fp-success.visible { display:block; }
    .progress-dots { display:flex; justify-content:center; gap:var(--space-2); margin-bottom:var(--space-6); }
    .progress-dot { width:10px; height:10px; border-radius:50%; background:var(--gray-200); transition:background 0.3s; }
    .progress-dot.active { background:var(--secondary); }
  </style>
</head>
<body>
  <div class="fp-page">
    <div class="fp-card">
      <div class="fp-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>

      <div class="progress-dots">
        <div class="progress-dot active" id="dot1"></div>
        <div class="progress-dot" id="dot2"></div>
        <div class="progress-dot" id="dot3"></div>
      </div>

      <!-- Step 1: Enter Email -->
      <div class="fp-step active" id="step-email">
        <h1 class="fp-title">Forgot Password?</h1>
        <p class="fp-subtitle">Enter your email and we'll send you a verification code</p>
        <div class="fp-error" id="email-error"><span id="email-error-text"></span></div>
        <form class="fp-form" onsubmit="sendResetOtp(event)">
          <div class="form-group">
            <label class="form-label" for="reset-email">Email Address</label>
            <input type="email" id="reset-email" class="form-input" placeholder="you@college.edu" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" id="send-otp-btn" style="width:100%">
            <span class="btn-text">Send Verification Code</span>
          </button>
        </form>
        <div id="dev-otp-info" style="display:none;margin-top:var(--space-4);background:var(--warning-bg);color:var(--warning);padding:var(--space-3);border-radius:var(--radius-md);font-size:var(--text-xs)">
          <strong>Dev OTP:</strong> <code id="dev-otp-val"></code>
        </div>
      </div>

      <!-- Step 2: Reset Password -->
      <div class="fp-step" id="step-reset">
        <h1 class="fp-title">Set New Password</h1>
        <p class="fp-subtitle">Enter your new password below</p>
        <div class="fp-error" id="reset-error"><span id="reset-error-text"></span></div>
        <form class="fp-form" onsubmit="resetPassword(event)">
          <div class="form-group">
            <label class="form-label" for="new-password">New Password</label>
            <input type="password" id="new-password" class="form-input" placeholder="Min 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-new-password">Confirm New Password</label>
            <input type="password" id="confirm-new-password" class="form-input" placeholder="Re-enter password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" id="reset-btn" style="width:100%">
            <span class="btn-text">Reset Password</span>
          </button>
        </form>
      </div>

      <!-- Step 3: Success -->
      <div class="fp-step" id="step-success">
        <div style="text-align:center">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--success-bg);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-4)">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <h2 style="font-size:var(--text-xl);margin-bottom:var(--space-2)">Password Reset!</h2>
          <p style="color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--space-6)">Your password has been reset successfully.</p>
          <a href="/pages/login.html" class="btn btn-primary btn-lg" style="width:100%">Sign In</a>
        </div>
      </div>

      <div style="text-align:center;margin-top:var(--space-6)">
        <a href="/pages/login.html" style="color:var(--text-secondary);font-size:var(--text-sm)">← Back to Login</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let resetToken = null;
    const urlParams = new URLSearchParams(window.location.search);

    // If coming back from OTP page with a token
    if (urlParams.get('step') === 'reset' && urlParams.get('token')) {
      resetToken = urlParams.get('token');
      showStep('step-reset', 2);
    }

    function showStep(stepId, dotNum) {
      document.querySelectorAll('.fp-step').forEach(s => s.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
      document.querySelectorAll('.progress-dot').forEach((d, i) => d.classList.toggle('active', i < dotNum));
    }

    async function sendResetOtp(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const errorEl = document.getElementById('email-error');
      errorEl.classList.remove('visible');

      if (!email) { errorEl.classList.add('visible'); document.getElementById('email-error-text').textContent='Please enter your email.'; return; }

      const btn = document.getElementById('send-otp-btn');
      App.showLoading(btn, 'Sending...');

      try {
        const result = await API.auth.forgotPassword(email);
        App.hideLoading(btn);

        if (result._dev_otp) {
          document.getElementById('dev-otp-info').style.display = 'block';
          document.getElementById('dev-otp-val').textContent = result._dev_otp;
        }

        // Redirect to OTP page
        let otpUrl = `/pages/otp.html?email=${encodeURIComponent(email)}&purpose=PASSWORD_RESET`;
        if (result._dev_otp) otpUrl += `&dev_otp=${result._dev_otp}`;
        window.location.href = otpUrl;
      } catch (err) {
        App.hideLoading(btn);
        errorEl.classList.add('visible');
        document.getElementById('email-error-text').textContent = err.error || 'Failed to send reset code.';
      }
    }

    async function resetPassword(e) {
      e.preventDefault();
      const newPw = document.getElementById('new-password').value;
      const confirmPw = document.getElementById('confirm-new-password').value;
      const errorEl = document.getElementById('reset-error');
      errorEl.classList.remove('visible');

      if (newPw !== confirmPw) { errorEl.classList.add('visible'); document.getElementById('reset-error-text').textContent='Passwords do not match.'; return; }
      if (newPw.length < 8) { errorEl.classList.add('visible'); document.getElementById('reset-error-text').textContent='Password must be at least 8 characters.'; return; }

      const btn = document.getElementById('reset-btn');
      App.showLoading(btn, 'Resetting...');

      try {
        await API.auth.resetPassword(resetToken, newPw);
        showStep('step-success', 3);
      } catch (err) {
        App.hideLoading(btn);
        errorEl.classList.add('visible');
        document.getElementById('reset-error-text').textContent = err.error || 'Password reset failed.';
      }
    }
  </script>
</body>
</html>
