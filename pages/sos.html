<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOS — Kavach Campus</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    body { background: var(--danger-bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
    
    .sos-container { text-align: center; z-index: 10; position: relative; }
    
    .sos-button { width: 240px; height: 240px; border-radius: 50%; background: var(--danger); color: white; border: none; font-size: 48px; font-weight: 900; font-family: var(--font-display); cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4), inset 0 -10px 20px rgba(0,0,0,0.2); position: relative; transition: transform 0.2s; user-select: none; }
    
    .sos-button:active { transform: scale(0.95); }
    
    .sos-ripple { position: absolute; inset: 0; border-radius: 50%; background: var(--danger); z-index: -1; animation: ripple 2s infinite cubic-bezier(0.65, 0, 0.34, 1); }
    
    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2); opacity: 0; }
    }

    .sos-title { font-size: var(--text-3xl); font-weight: var(--font-bold); color: var(--danger); margin-top: var(--space-8); margin-bottom: var(--space-2); }
    .sos-subtitle { color: var(--text-secondary); font-size: var(--text-lg); }

    .cancel-btn { margin-top: var(--space-8); background: transparent; color: var(--text-secondary); border: 2px solid var(--gray-300); padding: var(--space-3) var(--space-8); border-radius: 999px; font-weight: var(--font-bold); cursor: pointer; transition: all var(--transition-fast); }
    .cancel-btn:hover { background: var(--gray-100); color: var(--text-primary); }

    /* Modal for Countdown */
    .countdown-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; color: white; }
    .countdown-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
    .countdown-number { font-size: 120px; font-weight: 900; font-family: var(--font-display); color: var(--danger); margin: var(--space-4) 0; }
    
    /* Sent Screen */
    .sent-overlay { position: fixed; inset: 0; background: var(--danger); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; color: white; text-align: center; padding: var(--space-6); }
    .sent-overlay.active { display: flex; animation: fadeIn 0.3s ease; }
  </style>
</head>
<body>

  <div class="sos-container animate-fade-in-up">
    <button class="sos-button" id="sos-trigger">
      SOS
      <div class="sos-ripple"></div>
    </button>
    <h1 class="sos-title">Emergency Assistance</h1>
    <p class="sos-subtitle">Tap the button to instantly alert campus security.</p>
    
    <button class="cancel-btn" onclick="window.history.back()">Go Back</button>
  </div>

  <div class="countdown-overlay" id="countdown-overlay">
    <h2 style="font-size:32px;margin-bottom:16px">Sending SOS Alert in</h2>
    <div class="countdown-number" id="countdown-number">3</div>
    <p style="color:#aaa;margin-bottom:32px;font-size:18px">We are acquiring your location.</p>
    <button class="btn btn-outline" style="border-color:#555;color:white;width:200px" id="cancel-sos">Cancel</button>
  </div>

  <div class="sent-overlay" id="sent-overlay">
    <div style="width:100px;height:100px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:32px">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>
    <h1 style="font-size:48px;font-weight:900;margin-bottom:16px">SOS SENT</h1>
    <p style="font-size:20px;max-width:500px;line-height:1.5;margin-bottom:32px">Campus security has been alerted. Your location and details have been transmitted. Stay calm, help is on the way.</p>
    <div style="background:rgba(0,0,0,0.2);padding:16px 24px;border-radius:12px;font-family:monospace;font-size:24px" id="sos-case-id">CASE #---</div>
    
    <button class="btn btn-outline" style="margin-top:48px;border-color:rgba(255,255,255,0.5);color:white" onclick="window.location.href='/pages/my-cases.html'">View Status</button>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!App.requireAuth()) throw new Error("Auth");

    let countdownTimer;
    let locationData = "Location not available";

    document.getElementById('sos-trigger').addEventListener('click', () => {
      // 1. Get location silently
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => locationData = `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}`,
          err => console.warn('Geolocation denied/failed', err)
        );
      }

      // 2. Show Countdown
      const overlay = document.getElementById('countdown-overlay');
      const numberEl = document.getElementById('countdown-number');
      overlay.classList.add('active');
      
      let count = 3;
      numberEl.textContent = count;

      countdownTimer = setInterval(() => {
        count--;
        if (count > 0) {
          numberEl.textContent = count;
        } else {
          clearInterval(countdownTimer);
          triggerSOS();
        }
      }, 1000);
    });

    document.getElementById('cancel-sos').addEventListener('click', () => {
      clearInterval(countdownTimer);
      document.getElementById('countdown-overlay').classList.remove('active');
    });

    async function triggerSOS() {
      document.getElementById('countdown-number').innerHTML = '<div class="spinner" style="border-color:rgba(255,255,255,0.3);border-top-color:var(--danger);width:80px;height:80px"></div>';
      
      try {
        const payload = {
          subject: "SOS ALERT",
          description: `Emergency SOS triggered by user.\nLocation Data: ${locationData}`,
          is_anonymous: false
        };

        const res = await API.cases.create(payload);
        
        // Hide countdown, show success
        document.getElementById('countdown-overlay').classList.remove('active');
        document.getElementById('sos-case-id').textContent = 'CASE ' + res.case.case_number;
        document.getElementById('sent-overlay').classList.add('active');

      } catch (err) {
        App.toast('Critical Error: Failed to send SOS. Please call security directly.', 'error');
        document.getElementById('countdown-overlay').classList.remove('active');
      }
    }
  </script>
</body>
</html>
