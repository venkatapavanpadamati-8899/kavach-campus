name: Kavach Safe Walk & Escalation Scheduler

on:
  schedule:
    # Runs every 2 minutes to satisfy the life-safety response interval
    - cron: '*/2 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (validate configuration without invoking live endpoints)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: safe-walk-escalation-scheduler
  cancel-in-progress: false

jobs:
  run-escalation-checks:
    runs-on: ubuntu-latest
    env:
      RAW_PROJECT_URL: ${{ secrets.VERCEL_PROJECT_URL || vars.VERCEL_PROJECT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      IS_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Validate Scheduler Configuration
        run: |
          RAW_URL="${RAW_PROJECT_URL:-https://kavach-campus.vercel.app}"

          # Enforce that CRON_SECRET is present in repository secrets
          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Configuration Error: Missing Secret::CRON_SECRET is not configured in GitHub Repository Secrets. The life-safety scheduler cannot run without authentication. Add CRON_SECRET under Settings -> Secrets and variables -> Actions."
            echo "FATAL: Life-safety scheduler cannot run without authentication secret CRON_SECRET."
            exit 1
          fi

          if ! TARGET_URL="$(node -e '
            try {
              const url = new URL(process.argv[1]);
              if (url.protocol !== "https:" || !url.hostname || url.username || url.password ||
                  url.pathname !== "/" || url.search || url.hash) process.exit(1);
              process.stdout.write(url.origin);
            } catch {
              process.exit(1);
            }
          ' "$RAW_URL")"; then
            echo "::error::INVALID CONFIGURATION: VERCEL_PROJECT_URL must be an HTTPS origin without a path, query, or credentials."
            exit 1
          fi
          printf 'TARGET_URL=%s\n' "$TARGET_URL" >> "$GITHUB_ENV"

          # Mask CRON_SECRET to ensure it never leaks to logs
          echo "::add-mask::$CRON_SECRET"
          echo "Configuration validated successfully: Target URL is $TARGET_URL and CRON_SECRET is present."

      - name: Dry Run Notice
        if: env.IS_DRY_RUN == 'true'
        run: echo "::notice title=Dry Run::Configuration validated. Live endpoints were skipped because dry_run was requested."

      - name: Trigger Safe Walk Timeout Check
        if: env.IS_DRY_RUN != 'true'
        run: |
          HTTP_STATUS=$(curl -s -S --output /dev/null --connect-timeout 10 --max-time 30 -w "%{http_code}" -X POST "${TARGET_URL}/api/cron/safe-walk-timeout" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "Safe Walk Timeout Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Safe walk timeout endpoint returned unexpected status: $HTTP_STATUS"
            exit 1
          fi
          echo "Safe Walk timeout check succeeded."

      - name: Trigger Staff Escalation Check
        if: env.IS_DRY_RUN != 'true'
        run: |
          HTTP_STATUS=$(curl -s -S --output /dev/null --connect-timeout 10 --max-time 30 -w "%{http_code}" -X POST "${TARGET_URL}/api/cron/escalate" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "Staff Escalation Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Escalation endpoint returned unexpected status: $HTTP_STATUS"
            exit 1
          fi
          echo "Staff escalation check succeeded."
